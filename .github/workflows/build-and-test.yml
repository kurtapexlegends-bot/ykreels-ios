name: YKReels iOS CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Package YKReels
    runs-on: macos-15

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Display Xcode & SDKs
      run: |
        xcodebuild -version
        xcodebuild -showsdks

    - name: Run Swift Unit Tests
      run: swift test -v

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build iOS Device App & Package IPA (for Sideloadly)
      run: |
        xcodebuild build \
          -project YKReels.xcodeproj \
          -scheme YKReels \
          -sdk iphoneos \
          -destination "generic/platform=iOS" \
          -configuration Release \
          -derivedDataPath derived_data_device \
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

        mkdir -p build_output
        cd derived_data_device/Build/Products/Release-iphoneos
        mkdir -p Payload
        cp -R YKReels.app Payload/
        zip -r -y ../../../../build_output/YKReels.ipa Payload
        cd ../../../..

    - name: Upload Sideload IPA (For Sideloadly & AltStore)
      uses: actions/upload-artifact@v4
      with:
        name: YKReels-Device-IPA
        path: build_output/YKReels.ipa
        retention-days: 14

    - name: Build iOS Simulator App (.app for Appetize.io)
      continue-on-error: true
      run: |
        xcodebuild build \
          -project YKReels.xcodeproj \
          -scheme YKReels \
          -sdk iphonesimulator \
          -destination "platform=iOS Simulator,name=iPhone 16" \
          -configuration Release \
          -derivedDataPath derived_data_sim \
          ONLY_ACTIVE_ARCH=NO \
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

    - name: Upload Appetize Simulator Bundle
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: YKReels-Appetize-Simulator
        path: derived_data_sim/Build/Products/Release-iphonesimulator/YKReels.app
        retention-days: 14
