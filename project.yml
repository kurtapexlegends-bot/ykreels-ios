name: YKReels
options:
  bundleIdPrefix: com.ykreels
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  YKReelsModules:
    path: .

targets:
  YKReels:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/ReelApp
    dependencies:
      - package: YKReelsModules
        product: ReelCore
      - package: YKReelsModules
        product: ReelDatabase
      - package: YKReelsModules
        product: ReelEngine
      - package: YKReelsModules
        product: ReelPlayer
      - package: YKReelsModules
        product: ReelDownload
      - package: YKReelsModules
        product: ReelUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ykreels.app
        INFOPLIST_FILE: Info.plist
        PRODUCT_NAME: YKReels
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_KEY_UILaunchScreen_Generation: YES

  YKReelsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/ReelTests
    dependencies:
      - target: YKReels
      - package: YKReelsModules
        product: ReelCore
      - package: YKReelsModules
        product: ReelDatabase
      - package: YKReelsModules
        product: ReelEngine
      - package: YKReelsModules
        product: ReelPlayer
      - package: YKReelsModules
        product: ReelDownload
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ykreels.tests
        SWIFT_VERSION: "5.10"
        CODE_SIGNING_ALLOWED: NO
